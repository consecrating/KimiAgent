[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kimiagent"
version = "0.2.0"
description = "KimiAgent — an AI agent that turns a topic or outline into a designer-quality PowerPoint deck and matching PDF."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "KimiAgent contributors" }]
keywords = ["powerpoint", "pptx", "pdf", "ai", "kimi", "slides", "presentation", "agent", "design-system"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = [
    "python-pptx>=0.6.23",
    "reportlab>=3.6",
]

[project.optional-dependencies]
kimi = ["openai>=1.0.0"]
images = ["pillow>=9.0"]
dev = ["pytest>=7.0", "pymupdf>=1.23"]

[project.scripts]
kimiagent = "kimiagent.cli:main"

[project.urls]
Homepage = "https://github.com/consecrating/KimiAgent"
Repository = "https://github.com/consecrating/KimiAgent"

[tool.setuptools.packages.find]
where = ["."]
include = ["kimiagent*"]
